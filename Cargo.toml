[package]
name = "run-with-other-gpu"
version = "0.1.0"
edition = "2021"
description = "Explorer context menu to launch an .exe on a different GPU"

[build-dependencies]
embed-resource = "2.5"

[dependencies]
anyhow = "1"
libui = "0.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = "s"
lto = true
strip = true
